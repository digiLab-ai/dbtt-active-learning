# Default Charpy / DBTT simulator configuration.
#
# These round curve parameters describe the EUROFER EAF plate-1 campaign: a
# symmetric tanh (width_lower == width_upper == 30 C). The asymmetric form is
# still supported -- set the two widths differently.
#
# Noise parameters are hand-set, not fitted.

name: eurofer_eaf
seed: 0
temperature_range: [-150.0, 100.0]

curve:
  lower_shelf: 5.0      # LS [J]
  upper_shelf: 200.0    # US [J]
  dbtt: -40.0           # DBTT [C]
  width_lower: 30.0     # transition width below the DBTT [C]
  width_upper: 30.0     # transition width above the DBTT [C]

noise:
  base: 3.0             # constant noise std [J]
  relative: 0.10        # noise std as a fraction of true energy [-]
  energy_floor: 0.0     # sampled energies clipped at this value [J]

specimen:
  material: EUROFER EAF
  condition: Base
  processing: Rolled
  orientation: RD
  specimen_design: ASTM
  specimen_location: EAF 1a Plate 1
  specimen_type: Charpy
  notch_type: V notch
  neurone_id_prefix: "NRN2025-"
  neurone_id_digits: 4
