[project]
name = "ukaea-dbtt-active-learning"
version = "0.1.0"
description = "Active learning for ductile-brittle transition temperature (DBTT) testing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # `dbtt.recovery` needs `optimize.minimize` for the shape search and
    # `stats.chi2` for the profile interval.
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "nbclient>=0.10"]
# The Uncertainty Engine SDK: a remote API client, published to PyPI. 0.15
# dropped the per-node classes (`uncertainty_engine.nodes.machine_learning` and
# friends); nodes are built off the client instead, so <0.15 will not work.
#   uv venv .venv-sdk --python 3.12
#   uv pip install --python .venv-sdk -e ".[sdk]"
sdk = ["uncertainty-engine>=0.15,<0.16", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
