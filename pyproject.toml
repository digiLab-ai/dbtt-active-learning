[project]
name = "ukaea-dbtt-active-learning"
version = "0.1.0"
description = "Active learning for ductile-brittle transition temperature (DBTT) testing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "nbclient>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
